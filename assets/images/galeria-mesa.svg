<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Mesa de postres variados">
  <defs>
    <radialGradient id="gfondo" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FBF0E4"/>
      <stop offset="100%" stop-color="#F6D9CE"/>
    </radialGradient>
    <linearGradient id="gm1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7B6C2"/>
      <stop offset="100%" stop-color="#E8879A"/>
    </linearGradient>
    <linearGradient id="gm2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#3A1F0E"/>
    </linearGradient>
    <linearGradient id="gm3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A2A4E"/>
      <stop offset="100%" stop-color="#6E1838"/>
    </linearGradient>
    <linearGradient id="gbiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF0E4"/>
      <stop offset="100%" stop-color="#EFD9C4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#gfondo)"/>

  <!-- Mesa -->
  <rect x="0" y="380" width="400" height="120" fill="#E8D5C4"/>
  <ellipse cx="200" cy="380" rx="200" ry="20" fill="#D9C0AA"/>

  <!-- Charlotte grande central -->
  <g transform="translate(95 180)">
    <ellipse cx="105" cy="220" rx="95" ry="12" fill="#C9A88A" opacity="0.6"/>
    <g fill="url(#gbiz)" stroke="#D9B98E" stroke-width="1">
      <rect x="10" y="60" width="20" height="155" rx="10"/>
      <rect x="35" y="58" width="20" height="157" rx="10"/>
      <rect x="60" y="58" width="20" height="157" rx="10"/>
      <rect x="120" y="58" width="20" height="157" rx="10"/>
      <rect x="145" y="58" width="20" height="157" rx="10"/>
      <rect x="170" y="58" width="20" height="157" rx="10"/>
    </g>
    <rect x="10" y="118" width="180" height="16" fill="#B5285A" opacity="0.85"/>
    <ellipse cx="100" cy="58" rx="90" ry="28" fill="url(#gm1)"/>
    <path d="M10 58 Q100 22 190 58 L190 84 Q100 94 10 84 Z" fill="url(#gm1)"/>
    <g transform="translate(85 42)">
      <path d="M0 0 C-8 -5 -14 -3 -14 4 C-14 10 -5 13 0 15 C5 13 14 10 14 4 C14 -3 8 -5 0 0 Z" fill="#E63946"/>
      <path d="M-4 -1 L-6 -6 L-2 -4 L0 -7 L2 -4 L6 -6 L4 -1 Z" fill="#4A8B3A"/>
    </g>
    <g transform="translate(115 38)">
      <path d="M0 0 C-8 -5 -14 -3 -14 4 C-14 10 -5 13 0 15 C5 13 14 10 14 4 C14 -3 8 -5 0 0 Z" fill="#D6283A"/>
      <path d="M-4 -1 L-6 -6 L-2 -4 L0 -7 L2 -4 L6 -6 L4 -1 Z" fill="#4A8B3A"/>
    </g>
  </g>

  <!-- Mini charlotte izquierda (chocolate) -->
  <g transform="translate(20 260)">
    <ellipse cx="40" cy="110" rx="42" ry="8" fill="#C9A88A" opacity="0.5"/>
    <g fill="url(#gbiz)" stroke="#D9B98E" stroke-width="0.8">
      <rect x="8" y="30" width="14" height="78" rx="7"/>
      <rect x="26" y="28" width="14" height="80" rx="7"/>
      <rect x="44" y="28" width="14" height="80" rx="7"/>
      <rect x="62" y="30" width="14" height="78" rx="7"/>
    </g>
    <ellipse cx="40" cy="28" rx="32" ry="11" fill="url(#gm2)"/>
    <path d="M8 28 Q40 14 72 28 L72 38 Q40 46 8 38 Z" fill="url(#gm2)"/>
    <rect x="8" y="58" width="68" height="10" fill="#B5285A" opacity="0.8"/>
  </g>

  <!-- Mini charlotte derecha (frutos rojos) -->
  <g transform="translate(300 270)">
    <ellipse cx="40" cy="100" rx="42" ry="8" fill="#C9A88A" opacity="0.5"/>
    <g fill="url(#gbiz)" stroke="#D9B98E" stroke-width="0.8">
      <rect x="8" y="28" width="14" height="72" rx="7"/>
      <rect x="26" y="26" width="14" height="74" rx="7"/>
      <rect x="44" y="26" width="14" height="74" rx="7"/>
      <rect x="62" y="28" width="14" height="72" rx="7"/>
    </g>
    <ellipse cx="40" cy="26" rx="32" ry="11" fill="url(#gm3)"/>
    <path d="M8 26 Q40 12 72 26 L72 36 Q40 44 8 36 Z" fill="url(#gm3)"/>
    <rect x="8" y="56" width="68" height="10" fill="#B5285A" opacity="0.8"/>
    <circle cx="35" cy="22" r="4" fill="#3A4FA0"/>
    <circle cx="50" cy="20" r="4" fill="#3A4FA0"/>
    <circle cx="42" cy="24" r="3" fill="#3A1F4A"/>
  </g>

  <!-- Frutas decorativas sueltas -->
  <g transform="translate(180 360)">
    <path d="M0 0 C-7 -4 -12 -2 -12 4 C-12 9 -4 12 0 13 C4 12 12 9 12 4 C12 -2 7 -4 0 0 Z" fill="#E63946"/>
    <path d="M-3 -1 L-5 -5 L-2 -3 L0 -6 L2 -3 L5 -5 L3 -1 Z" fill="#4A8B3A"/>
  </g>
  <g transform="translate(210 365)">
    <path d="M0 0 C-7 -4 -12 -2 -12 4 C-12 9 -4 12 0 13 C4 12 12 9 12 4 C12 -2 7 -4 0 0 Z" fill="#D6283A"/>
    <path d="M-3 -1 L-5 -5 L-2 -3 L0 -6 L2 -3 L5 -5 L3 -1 Z" fill="#4A8B3A"/>
  </g>

  <!-- Hojas装饰 -->
  <g fill="#4A8B3A" opacity="0.85">
    <path d="M165 358 Q160 350 158 360 Q163 363 165 358 Z"/>
    <path d="M225 360 Q230 352 232 362 Q227 365 225 360 Z"/>
  </g>
