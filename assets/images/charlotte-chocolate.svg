<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Charlotte de chocolate">
  <defs>
    <radialGradient id="cfondo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F3E6D8"/>
      <stop offset="100%" stop-color="#E5C9A8"/>
    </radialGradient>
    <linearGradient id="cbiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#C99E6E"/>
    </linearGradient>
    <linearGradient id="cmousse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#3A1F0E"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#cfondo)"/>

  <ellipse cx="200" cy="448" rx="165" ry="24" fill="#C9A07A" opacity="0.5"/>

  <!-- Bizcochos -->
  <g fill="url(#cbiz)" stroke="#A87A4E" stroke-width="1.2">
    <rect x="80" y="250" width="30" height="180" rx="14"/>
    <rect x="115" y="248" width="30" height="182" rx="14"/>
    <rect x="150" y="246" width="30" height="184" rx="14"/>
    <rect x="220" y="246" width="30" height="184" rx="14"/>
    <rect x="255" y="248" width="30" height="182" rx="14"/>
    <rect x="290" y="250" width="30" height="180" rx="14"/>
  </g>
  <g stroke="#8B6239" stroke-width="0.8" opacity="0.6">
    <line x1="80" y1="290" x2="110" y2="290"/><line x1="80" y1="330" x2="110" y2="330"/><line x1="80" y1="370" x2="110" y2="370"/>
    <line x1="115" y1="290" x2="145" y2="290"/><line x1="115" y1="330" x2="145" y2="330"/><line x1="115" y1="370" x2="145" y2="370"/>
    <line x1="150" y1="290" x2="180" y2="290"/><line x1="150" y1="330" x2="180" y2="330"/><line x1="150" y1="370" x2="180" y2="370"/>
    <line x1="220" y1="290" x2="250" y2="290"/><line x1="220" y1="330" x2="250" y2="330"/><line x1="220" y1="370" x2="250" y2="370"/>
    <line x1="255" y1="290" x2="285" y2="290"/><line x1="255" y1="330" x2="285" y2="330"/><line x1="255" y1="370" x2="285" y2="370"/>
    <line x1="290" y1="290" x2="320" y2="290"/><line x1="290" y1="330" x2="320" y2="330"/><line x1="290" y1="370" x2="320" y2="370"/>
  </g>

  <!-- Cinta rosa -->
  <rect x="78" y="318" width="244" height="22" fill="#B5285A" opacity="0.9"/>
  <path d="M322 329 Q345 318 358 332 Q348 340 330 336 Z" fill="#9B1F4B"/>

  <!-- Mousse de chocolate -->
  <ellipse cx="200" cy="250" rx="125" ry="40" fill="url(#cmousse)"/>
  <path d="M80 250 Q200 200 320 250 L320 290 Q200 300 80 290 Z" fill="url(#cmousse)"/>

  <!-- Virutas de chocolate -->
  <g fill="#2A1408">
    <rect x="140" y="222" width="18" height="4" rx="2" transform="rotate(20 149 224)"/>
    <rect x="175" y="218" width="22" height="4" rx="2" transform="rotate(-15 186 220)"/>
    <rect x="220" y="225" width="20" height="4" rx="2" transform="rotate(10 230 227)"/>
    <rect x="155" y="238" width="16" height="3" rx="1.5" transform="rotate(-25 163 239)"/>
    <rect x="250" y="232" width="18" height="4" rx="2" transform="rotate(15 259 234)"/>
    <rect x="190" y="235" width="14" height="3" rx="1.5" transform="rotate(40 197 236)"/>
  </g>

  <!-- Fresas decorativas (medias) -->
  <g transform="translate(200 215)">
    <path d="M0 0 C-9 -6 -16 -3 -16 5 C-16 11 -7 16 0 18 C7 16 16 11 16 5 C16 -3 9 -6 0 0 Z" fill="#C8302E" opacity="0.9"/>
    <path d="M-6 -1 L-9 -7 L-3 -4 L0 -8 L3 -4 L9 -7 L6 -1 Z" fill="#4A8B3A"/>
  </g>

  <!-- Brillo -->
  <ellipse cx="170" cy="245" rx="40" ry="8" fill="#fff" opacity="0.15"/>
</svg>
