<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Charlotte de chocolate en cocina artesanal">
  <defs>
    <radialGradient id="hfondo" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="60%" stop-color="#3A1F0E"/>
      <stop offset="100%" stop-color="#2A1408"/>
    </radialGradient>
    <linearGradient id="hmousse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#3A1F0E"/>
    </linearGradient>
    <linearGradient id="hbiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#A87A4E"/>
    </linearGradient>
    <radialGradient id="luz" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFE4A0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFB85A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#hfondo)"/>

  <!-- Luces cálidas desenfocadas (bokeh) -->
  <g opacity="0.85">
    <circle cx="70" cy="80" r="22" fill="#FFD38A" opacity="0.35" filter="blur(4px)"/>
    <circle cx="330" cy="60" r="28" fill="#FFC76B" opacity="0.3" filter="blur(5px)"/>
    <circle cx="360" cy="300" r="20" fill="#FFD38A" opacity="0.35" filter="blur(4px)"/>
    <circle cx="40" cy="380" r="24" fill="#FFB85A" opacity="0.28" filter="blur(4px)"/>
    <circle cx="200" cy="40" r="18" fill="#FFE4A0" opacity="0.4" filter="blur(3px)"/>
    <circle cx="160" cy="160" r="10" fill="#FFD38A" opacity="0.5" filter="blur(2px)"/>
    <circle cx="280" cy="180" r="14" fill="#FFC76B" opacity="0.4" filter="blur(3px)"/>
  </g>

  <!-- Mesa -->
  <rect x="0" y="430" width="400" height="70" fill="#2A1408"/>
  <rect x="0" y="430" width="400" height="70" fill="url(#luz)" opacity="0.4"/>

  <!-- Charlotte -->
  <ellipse cx="200" cy="438" rx="150" ry="18" fill="#000" opacity="0.5"/>
  <g fill="url(#hbiz)" stroke="#8B6239" stroke-width="1">
    <rect x="85" y="260" width="28" height="175" rx="13"/>
    <rect x="118" y="258" width="28" height="177" rx="13"/>
    <rect x="151" y="256" width="28" height="179" rx="13"/>
    <rect x="221" y="256" width="28" height="179" rx="13"/>
    <rect x="254" y="258" width="28" height="177" rx="13"/>
    <rect x="287" y="260" width="28" height="175" rx="13"/>
  </g>
  <ellipse cx="200" cy="258" rx="115" ry="36" fill="url(#hmousse)"/>
  <path d="M85 258 Q200 210 315 258 L315 295 Q200 305 85 295 Z" fill="url(#hmousse)"/>

  <!-- Cinta -->
  <rect x="83" y="322" width="234" height="20" fill="#B5285A" opacity="0.85"/>
  <path d="M317 332 Q338 322 350 334 Q340 341 324 338 Z" fill="#9B1F4B"/>

  <!-- Virutas y装饰 -->
  <g fill="#2A1408">
    <rect x="150" y="232" width="16" height="3.5" rx="1.5" transform="rotate(20 158 234)"/>
    <rect x="180" y="228" width="20" height="3.5" rx="1.5" transform="rotate(-15 190 230)"/>
    <rect x="225" y="232" width="18" height="3.5" rx="1.5" transform="rotate(10 234 234)"/>
    <rect x="255" y="236" width="16" height="3.5" rx="1.5" transform="rotate(25 263 238)"/>
  </g>
  <g transform="translate(205 222)">
    <path d="M0 0 C-9 -6 -16 -3 -16 5 C-16 11 -7 16 0 18 C7 16 16 11 16 5 C16 -3 9 -6 0 0 Z" fill="#C8302E"/>
    <path d="M-6 -1 L-9 -7 L-3 -4 L0 -8 L3 -4 L9 -7 L6 -1 Z" fill="#4A8B3A"/>
  </g>

  <!-- Velas/luces cálidas -->
  <g>
    <circle cx="120" cy="120" r="4" fill="#FFE4A0"/>
    <circle cx="120" cy="120" r="8" fill="#FFD38A" opacity="0.4"/>
    <circle cx="120" cy="120" r="14" fill="#FFB85A" opacity="0.2"/>
  </g>
  <g>
    <circle cx="295" cy="140" r="4" fill="#FFE4A0"/>
    <circle cx="295" cy="140" r="8" fill="#FFD38A" opacity="0.4"/>
    <circle cx="295" cy="140" r="14" fill="#FFB85A" opacity="0.2"/>
  </g>

  <!-- Vineta -->
  <rect width="400" height="500" fill="url(#luz)" opacity="0.3"/>
</svg>
